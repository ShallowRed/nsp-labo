<!doctype html>
<notebook>
  <title>Palette des graphiques du rapport</title>
  <script type="module">
    import { Plot, html } from "./lib/deps.js";
    import { SCENARIOS } from "./lib/scenarios.js";
    import { genSpectre, paliers, simulate } from "./lib/spectre.js";
    const spR = genSpectre(SCENARIOS.resserre);
    const psR = paliers(19);
    const tR = (f, p) => spR[f][psR.indexOf(p)];
    const ENCRE = tR("ardoise", 850);
    const contraste = (a, b) => {
      const lum = (hex) => { const c = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255)
        .map((v) => (v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4));
        return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; };
      const [x, y] = [lum(a), lum(b)].sort((m, n) => n - m);
      return (x + 0.05) / (y + 0.05);
    };
    const OPTIONS = [
      { nom: "maquette actuelle", hex: ["#438F44", "#8DA83A", "#F1881D", "#CC5426", "#DADADA"] },
      { nom: "canard et coquelicot", refs: [["canard", 550], ["canard", 300], ["ambre", 200], ["coquelicot", 500], ["ardoise", 150]] },
      { nom: "pétrole et coquelicot", refs: [["petrole", 700], ["petrole", 350], ["ambre", 200], ["coquelicot", 500], ["ardoise", 150]] },
      { nom: "lavande et coquelicot", refs: [["lavande", 700], ["lavande", 300], ["ambre", 200], ["coquelicot", 550], ["ardoise", 150]] },
    ].map((o) => ({ ...o, hex: o.hex ?? o.refs.map(([f, p]) => tR(f, p).toUpperCase()) }));
    const MODALITES = ["bien", "plutôt bien", "plutôt mal", "mal", "ne sait pas"];
    // valeurs lues sur la maquette, segments non étiquetés déduits par solde
    const CROISEMENTS = [
      ["Tranche d'âge", { "0-34": [18, 62, 12, 3, 5], "35-44": [17, 58, 16, 3, 6], "45-54": [15, 57, 17, 5, 6], "55+": [17, 53, 17, 5, 8] }],
      ["Versant", { "FPE": [17, 55, 17, 4, 7], "FPT": [17, 58, 16, 3, 6], "FPH": [17, 63, 13, 3, 4] }],
      ["Supervision", { "Oui, tâche principale": [18, 62, 12, 4, 4], "Oui, tâche secondaire": [17, 55, 18, 4, 6], "Non": [16, 58, 15, 4, 7] }],
    ];
  </script>
  <script type="module">
    const vision = view(Inputs.select(
      new Map([["vision typique", "normal"], ["deutéranopie (rouge-vert, la plus courante)", "deutan"], ["protanopie (rouge-vert)", "protan"], ["tritanopie (bleu-jaune, rare)", "tritan"]]),
      { label: "Vision" }
    ));
    const option = view(Inputs.radio(new Map(OPTIONS.map((o) => [o.nom, o])), { label: "Palette", value: OPTIONS[1] }));
  </script>
  <script type="module">
    const voirS = (h) => (vision === "normal" ? h : simulate(h, vision));
    display(html`<div style="display:flex; gap:26px; flex-wrap:wrap; margin:0.2rem 0 0.9rem;">
      ${OPTIONS.map((o) => html`<div>
        <div style="display:flex; gap:2px;">${o.hex.map((h) => html`<span style="width:32px; height:22px; border-radius:3px; background:${voirS(h)};"></span>`)}</div>
        <div style="font-size:0.78em; margin-top:3px; color:${o.nom === option.nom ? "#1d2022" : "#8a9199"}; font-weight:${o.nom === option.nom ? 600 : 400};">${o.nom}</div>
      </div>`)}
    </div>`);
  </script>
  <script type="module">
    const cols = option.hex.map((h) => (vision === "normal" ? h : simulate(h, vision)));
    const encre = vision === "normal" ? ENCRE : simulate(ENCRE, vision);
    display(html`<div>${CROISEMENTS.map(([titre, lignes]) => {
      const seg = Object.entries(lignes).flatMap(([ctx, vals]) => {
        let x = 0;
        return vals.map((v, i) => { const o = { ctx, x0: x, x1: x + v, c: cols[i], v, m: MODALITES[i] }; x += v; return o; });
      });
      return Plot.plot({
        width: 660, height: 22 + Object.keys(lignes).length * 30, marginLeft: 150, marginTop: 22, marginBottom: 4,
        x: { label: null, domain: [0, 100], ticks: [0, 25, 50, 75, 100] },
        y: { label: null, domain: Object.keys(lignes) },
        color: { type: "identity" },
        marks: [
          Plot.text([titre], { frameAnchor: "top-left", dx: -142, dy: -14, text: (d) => d, fontWeight: 700, fill: encre }),
          Plot.barX(seg, { y: "ctx", x1: "x0", x2: "x1", fill: "c", insetTop: 3, insetBottom: 3, tip: true, title: (d) => `${d.m} : ${d.v} %` }),
          Plot.text(seg.filter((d) => d.v >= 5), { y: "ctx", x: (d) => (d.x0 + d.x1) / 2, text: (d) => `${d.v}`, fontSize: 11,
            fill: (d) => (contraste(d.c, "#ffffff") >= contraste(d.c, encre) ? "white" : encre) }),
        ],
      });
    })}
    ${Plot.legend({ color: { domain: MODALITES, range: cols }, swatchSize: 14 })}</div>`);
  </script>
  <script type="module">
    const blocR = ["vert1", "vert2", "rouge3", "rouge1", "gris2"]
      .map((v, i) => `${v.padEnd(6)} <- "${option.hex[i]}"   # ${MODALITES[i]}`).join("\n");
    const bouton = html`<button style="font:inherit; font-size:0.82em; padding:5px 12px; border-radius:6px; border:1px solid ${tR("petrole", 300)}; background:${tR("petrole", 100)}; color:${tR("petrole", 800)}; cursor:pointer;">copier pour R</button>`;
    bouton.onclick = async () => {
      await navigator.clipboard.writeText(blocR);
      bouton.textContent = "copié";
      setTimeout(() => (bouton.textContent = "copier pour R"), 1500);
    };
    display(html`<div style="display:flex; gap:12px; align-items:flex-start;">
      <pre style="margin:0; background:#f6f7f8; border-radius:6px; padding:12px 14px; font-size:0.82em; line-height:1.5;">${blocR}</pre>
      ${bouton}
    </div>`);
  </script>
</notebook>
