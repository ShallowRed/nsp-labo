  <script type="text/markdown">
# Spectre couleurs NSP : scénarios

Exploration des variations du spectre unifié (chantier refonte de la charte, carte Pawn `projets/nos-services-publics/`). L'espace exploré : nombre de familles, distance au bleu pétrole NSP (continuité ou rupture), profils de chroma. Tout est calculé (OKLCH, contrastes WCAG, simulation daltonisme par matrices de Viénot), rien n'est estimé à l'oeil.

Le scénario **médian v0.1** est le draft de la première passe (2026-07-17), les trois autres balisent l'espace autour de lui.
  </script>
  <script type="module">
    import * as Plot from "npm:@observablehq/plot";
    import { html } from "npm:htl";
    import { SCENARIOS, CATEGORIEL } from "./lib/scenarios.js";
    import {
      genSpectre, paliers, garanties, continuite, aaOnWhite,
      bestCategorical, simulate, okOf, PETROLE_NSP
    } from "./lib/spectre.js";
    const sources = await FileAttachment("data/sources.json").json();
  </script>
  <script type="text/markdown">
## Choisir un scénario et ses variations
  </script>
  <script type="module" pinned>
    const scenarioId = view(Inputs.select(Object.keys(SCENARIOS), {
      label: "Scénario",
      format: (id) => SCENARIOS[id].label
    }));
    const nPaliers = view(Inputs.radio([19, 11], { label: "Paliers", value: 19 }));
    const profil = view(Inputs.select(["(du scénario)", "cloche", "plateau", "constant"], { label: "Profil de chroma" }));
    const kGlobal = view(Inputs.range([0.7, 1.3], { label: "Intensité chroma", step: 0.05, value: 1 }));
  </script>
  <script type="module">
    const scenario = SCENARIOS[scenarioId];
    const overrides = {
      n: nPaliers,
      kGlobal: (scenario.options.kGlobal ?? 1) * kGlobal,
      ...(profil === "(du scénario)" ? {} : { profil })
    };
    const spectre = genSpectre(scenario, overrides);
    const ps = paliers(nPaliers);
    display(html`<p style="max-width:60em"><strong>${scenario.label}.</strong> ${scenario.these}</p>`);
  </script>
  <script type="text/markdown">
## Le spectre
  </script>
  <script type="module">
    const cells = Object.entries(spectre).flatMap(([famille, scale]) =>
      scale.map((hex, i) => ({ famille, palier: ps[i], hex, L: okOf(hex).L }))
    );
    display(Plot.plot({
      marginLeft: 84,
      width: 940,
      height: 26 * Object.keys(spectre).length + 40,
      padding: 0.05,
      x: { axis: "top", tickSize: 0, label: null },
      y: { tickSize: 0, label: null },
      color: { type: "identity" },
      marks: [
        Plot.cell(cells, {
          x: "palier", y: "famille", fill: "hex", inset: 0.5,
          title: (d) => `${d.famille} ${d.palier}\n${d.hex}\nL ${d.L.toFixed(3)}`
        })
      ]
    }));
  </script>
  <script type="text/markdown">
## Continuité avec le pétrole NSP

Le logo NSP 2025 est monochrome `#06708E`. Deux mesures : la couleur du spectre la plus proche (dE2000, moins de 5 = quasi identique), et la position des teintes par rapport à la sienne.
  </script>
  <script type="module">
    const cont = continuite(spectre);
    display(html`<p>
      Couleur la plus proche du logo : <span style="display:inline-block;width:2.2em;height:1.2em;vertical-align:middle;border-radius:3px;background:${cont.hex}"></span>
      <code>${cont.hex}</code> (${cont.porteur}), <strong>dE ${cont.dEmin}</strong>
      · logo : <span style="display:inline-block;width:2.2em;height:1.2em;vertical-align:middle;border-radius:3px;background:${PETROLE_NSP}"></span>
      <code>${PETROLE_NSP}</code>
      · ${Math.round(cont.partProche * 100)} % des familles à moins de 45° de sa teinte.
    </p>`);
  </script>
  <script type="module">
    const hRef = okOf(PETROLE_NSP).H;
    const hues = Object.entries(spectre).map(([famille, scale]) => {
      const mid = scale[Math.floor(scale.length / 2)];
      return { famille, H: okOf(mid).H, hex: mid };
    });
    display(Plot.plot({
      height: 90,
      width: 940,
      marginBottom: 34,
      x: { domain: [0, 360], label: "teinte OKLCH (°)", grid: true },
      y: { axis: null },
      color: { type: "identity" },
      marks: [
        Plot.ruleX([hRef], { stroke: "#06708e", strokeWidth: 2 }),
        Plot.text([{ x: hRef }], { x: "x", frameAnchor: "top", dy: -2, text: () => "pétrole NSP", fill: "#06708e", fontWeight: 600 }),
        Plot.dot(hues, { x: "H", y: () => 0, fill: "hex", r: 8, title: (d) => `${d.famille} · H ${Math.round(d.H)}°` }),
        Plot.text(hues, { x: "H", y: () => 0, text: "famille", dy: 18, fontSize: 10 })
      ]
    }));
  </script>
  <script type="text/markdown">
## Garanties de contraste mécaniques

La clarté étant linéaire sur les paliers, un écart de paliers garantit un contraste minimal, toutes familles confondues. Sur le draft v0.1 en 19 paliers : écart de 500 = AA texte (4.5). Vérifier ce que chaque variation fait à cette règle : c'est elle qui la rend transmissible aux bénévoles.
  </script>
  <script type="module">
    const cran = ps[1] - ps[0];
    const g = garanties(spectre, [6, 8, 10, 12, 14].filter((d) => d < ps.length));
    display(Inputs.table(g.map((r) => ({
      "écart (paliers)": r.ecartCrans * cran,
      "contraste garanti": r.contrasteMin,
      "couvre": r.contrasteMin >= 7 ? "AAA" : r.contrasteMin >= 4.5 ? "AA texte" : r.contrasteMin >= 3 ? "AA texte large / UI" : "décoratif"
    })), { width: 480 }));
    const aa = Object.fromEntries(Object.entries(spectre).map(([f, s]) => [f, aaOnWhite(s, ps)]));
    display(html`<p class="small">Premier palier AA sur blanc par famille : ${Object.entries(aa).map(([f, p]) => `${f} ${p}`).join(" · ")}.</p>`);
  </script>
  <script type="text/markdown">
## Catégoriel dataviz, sous contraintes

Recherche exhaustive du meilleur jeu de séries : paliers dans la bande de clarté (0.43-0.77 en light), chroma au-dessus du plancher (0.10), séparation daltonisme maximisée (protan, deutan, tritan), ordre des séries optimisé sur les paires adjacentes. Cible : dE adjacent supérieur à 12.
  </script>
  <script type="module" pinned>
    const modeCVD = view(Inputs.select(["normal", "protan", "deutan", "tritan"], { label: "Vision simulée" }));
  </script>
  <script type="module">
    const cat = bestCategorical(spectre, CATEGORIEL[scenarioId], { mode: "light", ps });
    if (cat.infaisable) {
      display(html`<p><strong>Infaisable</strong> pour ${cat.infaisable.join(", ")} : chroma sous le plancher dans la bande de clarté. La sobriété de ces familles a un coût dataviz : soit on les exclut du catégoriel, soit on leur donne une variante dédiée plus saturée.</p>`);
    } else {
      display(html`<p>Pire paire adjacente toutes visions : <strong>dE ${cat.adjacentMinDE}</strong> (cible 12).</p>`);
      display(Plot.plot({
        height: 70,
        width: 640,
        marginBottom: 30,
        x: { axis: null },
        y: { axis: null },
        color: { type: "identity" },
        marks: [
          Plot.cell(cat.ordered.map((c, i) => ({ ...c, i })), {
            x: "i", y: () => 0, fill: (d) => d.sims[modeCVD], inset: 2,
            title: (d) => `${d.famille} ${d.palier} ${d.hex}`
          }),
          Plot.text(cat.ordered.map((c, i) => ({ ...c, i })), { x: "i", y: () => 0, text: (d) => `${d.famille}\n${d.palier}`, dy: 34, fontSize: 10 })
        ]
      }));
    }
  </script>

  </script>

  <script type="module">
    // séquentiel : famille canard échantillonnée en 5 pas (150-750)

  <script type="text/markdown">
## Comparatif des scénarios

La même batterie de mesures sur les quatre scénarios (en 19 paliers, sans variation) : c'est la table d'arbitrage. Reproduite en CLI par `npm run check`.
  </script>
  <script type="module">
    const rows = Object.entries(SCENARIOS).map(([id, sc]) => {
      const sp = genSpectre(sc);
      const p19 = paliers(19);
      const cont = continuite(sp);
      const g = garanties(sp, [8, 10]);
      const catL = bestCategorical(sp, CATEGORIEL[id], { mode: "light", ps: p19 });
      return {
        scénario: sc.label,
        familles: Object.keys(sc.familles).length,
        "dE au pétrole": cont.dEmin,
        "Δ400": g[0].contrasteMin,
        "Δ500 (AA si ≥ 4.5)": g[1].contrasteMin,
        "catégoriel (dE adj)": catL.adjacentMinDE ?? `infaisable (${catL.infaisable?.length ?? 0} fam.)`,
        séries: catL.ordered ? catL.ordered.length : CATEGORIEL[id].length
      };
    });
    display(Inputs.table(rows, { width: 900 }));
  </script>
  <script type="text/markdown">
## Enseignements de la première itération

- La **continuité tempérée a un coût dataviz** : avec un chroma de caractère 0.55 et moins, pétrole et ardoise ne passent jamais le plancher de chroma dans la bande de clarté utile. Un scénario sobre doit soit assumer un catégoriel réduit, soit prévoir des variantes dataviz plus saturées de ses familles calmes.
- Le **profil plateau casse la règle des paliers** : en poussant le chroma des paliers moyens, la garantie « écart 500 = AA » tombe à 4.25. La vivacité se paie en prévisibilité du contraste ; si le collectif choisit un scénario vif, la règle devient « écart 550 ».
- **Resserré tient tête à médian** : 8 familles suffisent pour les mêmes garanties et un catégoriel équivalent (et meilleur en dark). Le passage de 11 à 8 se paie uniquement en finesse de thématisation.
- La question de fond reste ouverte et se joue en réunion, pas en calcul : **quelle distance au pétrole voulons-nous ?** Continuité (dE 4), médiane (le pétrole est une famille parmi d'autres) ou rupture (dE 11, le logo n'est plus exactement représentable).

Consignation et arbitrages : carte Pawn, notes `exploration-couleurs.md` et `refonte-charte.md`.
  </script>
