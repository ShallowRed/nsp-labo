# Spectre couleurs : quatre scénarios pour arbitrer

Ce document s'adresse aux membres du collectif qui participeront au choix de la future palette, sans supposer de connaissances en design ou en code. Quatre scénarios de « spectre » (le nuancier dont dériveront site, rapports, visuels et graphiques), des mesures objectives pour les comparer, et les questions à trancher. Dix minutes en lecture simple ; les réglages interactifs sont optionnels. Mémoire du chantier : carte Pawn `projets/nos-services-publics/`.
  </script>
  <script type="text/markdown">
## Les notions utiles, en clair

- Une couleur a trois dimensions : sa **teinte** (rouge, bleu, vert...), sa **clarté** (claire ou foncée), sa **saturation** (vive ou grisée).
- **OKLCH** mesure les couleurs telles que l'oeil les perçoit : deux couleurs de même clarté OKLCH paraissent réellement aussi claires, quelle que soit la teinte.
- **Les paliers, de 50 à 950** : chaque famille est déclinée du presque blanc (50) au presque noir (950). Même palier = même clarté, dans toutes les familles.
- **Le contraste** mesure la lisibilité d'une couleur sur une autre. Seuils d'accessibilité : 3 pour du texte de grande taille, 4.5 pour du texte courant (« AA »), 7 pour le confort maximal (« AAA »).
- **Le daltonisme** touche environ 8 % des hommes (surtout la confusion rouge-vert) : on simule ces visions pour vérifier les graphiques.
- **Le dE** mesure l'écart perçu entre deux couleurs : sous 5, l'oeil confond ; au-dessus de 12, on distingue sans effort.

Tout ce qui suit est calculé avec ces outils, rien n'est estimé à l'oeil.

  <script type="text/markdown">
## D'où on part

Le spectre est une idée que Lucas fait mûrir depuis plusieurs années : posée d'abord pour le Printemps des Services Publics (9 familles sur 19 paliers), puis réappliquée pour les cartes du rapport 2025 en reprenant les couleurs thématiques des rapports précédents (7 familles). Des étapes d'une même démarche, jamais consolidées : 16 nuanciers complets sans une seule valeur partagée, et des quasi-doublons involontaires (le « jasmin » du Printemps et le vert d'eau du site actuel sont indiscernables, dE 3.2). Le spectre unifié consolide cette trajectoire en un seul système.
  </script>

  <script type="text/markdown">
## Les quatre scénarios

Un scénario, c'est deux choix : quelles familles composent le spectre, et quel dosage de saturation leur donner. « Médian » est le brouillon de la première exploration ; les trois autres balisent l'espace : plus proche de l'identité actuelle, plus resserré, plus vif. Les trois familles retrouvées du spectre Printemps (bleuet, jasmin, olive) restent à replacer lors de la prochaine itération.
  </script>
  <script type="module">
    const scenarioId = view(Inputs.select(Object.keys(SCENARIOS), {
      label: "Scénario",
      format: (id) => SCENARIOS[id].label
    }));
    const nPaliers = view(Inputs.radio([19, 11], { label: "Paliers par famille", value: 19 }));
    const profil = view(Inputs.select(["(du scénario)", "cloche", "plateau", "constant"], { label: "Profil de saturation" }));
    const kGlobal = view(Inputs.range([0.7, 1.3], { label: "Intensité de saturation", step: 0.05, value: 1 }));
  </script>
  <script type="text/markdown">
Les deux derniers réglages explorent les « variations de saturation » consignées au chantier. Le **profil** décrit comment la saturation évolue le long des paliers : en *cloche*, elle culmine dans les tons moyens (450-550) et s'adoucit vers les extrêmes clairs et foncés, c'est le profil du brouillon ; en *plateau*, les tons moyens restent saturés plus longtemps, ce qui donne plus d'énergie mais affaiblit la garantie de lisibilité (voir plus bas) ; *constant* applique le même dosage partout, utile comme témoin. L'**intensité** multiplie la saturation de toutes les familles : 0.7 donne une version passée, 1.3 une version poussée. Chaque famille garde par ailleurs son caractère propre (le pétrole est volontairement plus tempéré que le coquelicot).
  </script>
  <script type="module">
    const scenario = SCENARIOS[scenarioId];
    const overrides = {
      n: nPaliers,
      kGlobal: (scenario.options.kGlobal ?? 1) * kGlobal,
      ...(profil === "(du scénario)" ? {} : { profil })
    };
    const spectre = genSpectre(scenario, overrides);
    const ps = paliers(nPaliers);
    display(html`<div style="max-width:60em;border-left:3px solid #06708e;padding:0.2em 0 0.2em 1em">
      <p><strong>${scenario.label}.</strong> ${scenario.these}</p>
      <p><strong>Ce que ça impliquerait.</strong> ${scenario.implications}</p>
    </div>`);
  </script>

  </script>

  <script type="text/markdown">
### Rester proche du bleu actuel, ou pas

Le logo du collectif est un bleu pétrole (`#06708E`). Question identitaire centrale : le nouveau spectre doit-il le contenir tel quel (continuité), à peu près (évolution), ou s'en émanciper (rupture) ?
  </script>
  <script type="module">
    const cont = continuite(spectre);
    display(html`<p style="max-width:60em">
      Couleur du spectre la plus proche du logo :
      <span style="display:inline-block;width:2.2em;height:1.2em;vertical-align:middle;border-radius:3px;background:${cont.hex}"></span>
      <code>${cont.hex}</code> (${cont.porteur}), à <strong>dE ${cont.dEmin}</strong> du logo
      <span style="display:inline-block;width:2.2em;height:1.2em;vertical-align:middle;border-radius:3px;background:${PETROLE_NSP}"></span>.

    const hues = Object.entries(spectre).map(([famille, scale]) => {

    });

        Plot.ruleX([hRef], { stroke: "#06708e", strokeWidth: 2 }),
        Plot.text([{ x: hRef }], { x: "x", frameAnchor: "top", dy: -2, text: () => "bleu du logo", fill: "#06708e", fontWeight: 600 }),
        Plot.dot(hues, { x: "H", y: () => 0, fill: "hex", r: 8, title: (d) => d.famille }),
        Plot.text(hues, { x: "H", y: () => 0, text: "famille", dy: 18, fontSize: 10 })
      ]
    }));
  </script>
  <script type="text/markdown">
### La règle de lisibilité

La clarté progressant régulièrement, une règle simple devient possible, transmissible à n'importe quel bénévole : **deux couleurs séparées d'un écart suffisant de paliers sont toujours lisibles l'une sur l'autre**, quelles que soient les familles. « Fond en 100, texte en 600 : lisible, garanti. » Le tableau vérifie la règle pour les réglages choisis ; les scénarios très saturés l'affaiblissent.
  </script>
  <script type="module">
    const cran = ps[1] - ps[0];
    const g = garanties(spectre, [6, 8, 10, 12, 14].filter((d) => d < ps.length));
    display(Inputs.table(g.map((r) => ({
      "écart (en paliers)": r.ecartCrans * cran,
      "contraste garanti": r.contrasteMin,
      "ce que ça permet": r.contrasteMin >= 7 ? "texte, confort maximal (AAA)" : r.contrasteMin >= 4.5 ? "texte courant (AA)" : r.contrasteMin >= 3 ? "texte de grande taille, boutons" : "usage décoratif seulement"
    })), { width: 640 }));
  </script>
  <script type="text/markdown">
### Les couleurs des graphiques

Un graphique à plusieurs séries exige des couleurs que tout le monde distingue, daltonisme compris. L'ordinateur cherche la meilleure combinaison (paliers ni trop clairs ni trop foncés, saturation suffisante, écarts maximaux sous les trois daltonismes simulés) plutôt que de choisir à l'oeil.
  </script>
  <script type="module">
    const libellesVision = {
      normal: "vision typique",
      protan: "protanopie (sans rouge)",
      deutan: "deutéranopie (sans vert, la plus courante)",
      tritan: "tritanopie (sans bleu, rare)"
    };
    const modeCVD = view(Inputs.select(Object.keys(libellesVision), {
      label: "Vision simulée",
      format: (v) => libellesVision[v]
    }));
  </script>
  <script type="module">
    const cat = bestCategorical(spectre, CATEGORIEL[scenarioId], { mode: "light", ps });
    if (cat.infaisable) {
      display(html`<p style="max-width:60em"><strong>Jeu incomplet :</strong> ${cat.infaisable.join(", ")} sont trop discrètes pour un graphique (saturation sous le plancher). Le prix de la sobriété : les exclure, ou leur créer une variante saturée dédiée.</p>`);
    } else {
      display(html`<p style="max-width:60em">Meilleure combinaison : la paire voisine la plus proche reste à <strong>dE ${cat.adjacentMinDE}</strong> dans le pire cas de vision (au-dessus de 12 : distinction sans effort).</p>`);
      display(Plot.plot({
        height: 70,
        width: 640,
        marginBottom: 30,
        x: { axis: null },
        y: { axis: null },
        color: { type: "identity" },
        marks: [
          Plot.cell(cat.ordered.map((c, i) => ({ ...c, i })), {
            x: "i", y: () => 0, fill: (d) => d.sims[modeCVD], inset: 2,
            title: (d) => `${d.famille}, palier ${d.palier}\n${d.hex}`
          }),
          Plot.text(cat.ordered.map((c, i) => ({ ...c, i })), { x: "i", y: () => 0, text: (d) => `${d.famille}\n${d.palier}`, dy: 34, fontSize: 10 })
        ]
      }));
    }
  </script>
  <script type="text/markdown">
### En situation

Trois mises en situation à données fictives : un graphique à barres, une carte à la manière du rapport (vraie géographie des départements), et des couvertures thématiques façon rapports papier (une famille de couleur par politique publique, comme les rapports 2023). Le fond teinté reproduit les fonds de chapitre des rapports.
  </script>
  <script type="module">
    const fondChoisi = view(Inputs.radio(["blanc", "menthe"], {
      label: "Fond",
      format: (v) => (v === "blanc" ? "fond blanc" : "fond teinté (comme les rapports)"),
      value: "blanc"
    }));
  </script>
  <script type="module">
    const fond = fondChoisi === "menthe" ? (spectre.canard ?? Object.values(spectre)[0])[0] : "#ffffff";
    const series = cat.ordered ?? [];
    const regions = [
      { region: "Occitanie", valeur: 84 }, { region: "AURA", valeur: 71 },
      { region: "Bretagne", valeur: 58 }, { region: "IDF", valeur: 52 },
      { region: "Grand Est", valeur: 38 }, { region: "PACA", valeur: 31 }
    ].slice(0, Math.max(series.length, 4));
    const famCarte = spectre.lavande ?? spectre.canard ?? Object.values(spectre)[0];
    const idx = nPaliers === 19 ? [2, 5, 8, 11, 14] : [1, 3, 5, 7, 9];
    const ramp = famCarte.filter((_, i) => idx.includes(i));
    const encre = famCarte[nPaliers === 19 ? 14 : 8];
    const valeurDep = (f) => {
      const c = f.properties.INSEE_DEP;
      let h = 0;
      for (const ch of c) h = (h * 31 + ch.charCodeAt(0)) % 997;
      return 5 + (h % 26);
    };
    display(html`<div style="background:${fond};padding:18px;border-radius:10px;display:flex;flex-wrap:wrap;gap:28px;border:1px solid #00000014;align-items:flex-start">
      <div>
        <p style="font-family:inherit;font-weight:700;color:${encre};margin:0 0 6px">Adhésions par région</p>
        ${Plot.plot({
          height: 40 + regions.length * 28,
          width: 400,
          marginLeft: 76,
          x: { grid: true, label: "adhésions (fictif)" },
          y: { label: null, tickSize: 0 },
          color: { type: "identity" },
          marks: [
            Plot.barX(regions.map((r, i) => ({ ...r, hex: series[i] ? simulate(series[i].hex, modeCVD) : "#999" })), {
              y: "region", x: "valeur", fill: "hex", rx: 3, sort: { y: "-x" },
              title: (d) => `${d.region} : ${d.valeur}`
            }),
            Plot.textX(regions, { y: "region", x: "valeur", text: "valeur", dx: 12, fontSize: 11 }),
            Plot.ruleX([0])
          ]
        })}
      </div>
      <div>
        <p style="font-family:inherit;font-weight:700;color:${encre};margin:0 0 6px">Durée médiane d'accès (données fictives)</p>
        ${Plot.plot({
          projection: { type: "conic-conformal", rotate: [-3, 0], parallels: [44, 49], domain: franceMetro },
          width: 430,
          height: 420,
          color: { type: "quantile", n: 5, range: ramp, label: "minutes (fictif)", legend: true },
          marks: [
            Plot.geo(franceMetro, {
              fill: (d) => valeurDep(d),
              stroke: encre, strokeWidth: 0.5,
              title: (d) => `${d.properties.NOM} : ${valeurDep(d)} min (fictif)`
            })
          ]
        })}
      </div>
    </div>`);
  </script>
  <script type="module">
    const themes = ["Santé", "Éducation", "Transports", "Sécurité / Justice", "Logement", "Environnement"];
    const fams = Object.keys(spectre).filter((f) => f !== "ardoise");
    const iHaut = nPaliers === 19 ? 10 : 6;

        <rect width="150" height="212" fill="${s[iBande]}"/>

        <path d="M 95 -30 A 85 85 0 0 1 40 105" fill="none" stroke="${s[iArc]}" stroke-width="13" opacity="0.55"/>
        <text x="12" y="22" font-size="8.5" font-weight="700" fill="white">Nos services publics</text>

        <text x="12" y="163" font-size="8" font-weight="600" fill="${s[iTexte]}">l'état des services publics</text>
        <text x="12" y="186" font-size="15" font-weight="700" fill="${s[iHaut]}">${theme}</text>
        <text x="138" y="186" font-size="8" text-anchor="end" fill="${s[iTexte]}">2026</text>
      </svg>`;
    };
    display(html`<div style="background:${fond};padding:18px;border-radius:10px;border:1px solid #00000014">
      <p style="font-weight:700;margin:0 0 12px">Déclinaison thématique (maquettes, une famille par politique publique)</p>
      <div style="display:flex;flex-wrap:wrap;gap:14px">${themes.map((t, i) => couv(t, fams[i % fams.length]))}</div>
    </div>`);

  <script type="text/markdown">
## Le comparatif d'ensemble

La même batterie de mesures sur les quatre scénarios (19 paliers, sans variation). Reproductible en ligne de commande : `npm run check`.
  </script>
  <script type="module">
    const rows = Object.entries(SCENARIOS).map(([id, sc]) => {
      const sp = genSpectre(sc);
      const p19 = paliers(19);
      const c = continuite(sp);
      const gg = garanties(sp, [8, 10]);
      const catL = bestCategorical(sp, CATEGORIEL[id], { mode: "light", ps: p19 });
      return {
        "scénario": sc.label,
        "familles": Object.keys(sc.familles).length,
        "proximité au bleu du logo (dE)": c.dEmin,
        "contraste garanti à 500 d'écart": gg[1].contrasteMin,
        "distinction des séries (dE)": catL.adjacentMinDE ?? "jeu incomplet",
        "séries possibles": catL.ordered ? catL.ordered.length : CATEGORIEL[id].length
      };
    });
    display(Inputs.table(rows, { width: 900 }));
    display(html`<p style="max-width:60em;font-size:0.9em;opacity:0.8">Clés : proximité sous dE 5 = le logo vit dans le spectre (11 = rupture) · 4.5 et plus à 500 d'écart = règle de lisibilité AA tenue · au-dessus de dE 12 = séries distinguables sans effort.</p>`);
  </script>
  <script type="text/markdown">
## Ce que les mesures nous apprennent

- **La sobriété a un coût sur les graphiques** : en scénario continuité, les bleus tempérés sont trop discrets pour la dataviz (4 séries au lieu de 6). À assumer, ou prévoir des variantes saturées dédiées.
- **La vivacité a un coût sur la règle** : en scénario vif, « 500 paliers d'écart = lisible » devient « 550 » (contraste 4.25). L'énergie se paie en simplicité.
- **Huit familles suffisent** : le resserré égale le médian avec trois familles de moins ; seule la réserve de nuances thématiques diminue.

## Les questions à trancher en réunion

1. **La distance au bleu actuel** : continuité, évolution ou rupture ? Question politique, pas calculable.
2. **Le nombre de familles** : la richesse du médian (11) ou la simplicité du resserré (8) ?
3. **Le niveau d'énergie** : accepter d'affaiblir un peu la règle de lisibilité pour gagner en vivacité ?
4. **La finesse du nuancier** : 19 paliers (continuité technique) ou 11 (plus simple au quotidien) ?

Décisions à consigner dans la carte Pawn (`exploration-couleurs.md`, `refonte-charte.md`).
  </script>
