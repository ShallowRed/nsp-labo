# Spectre couleurs : quatre scénarios pour arbitrer

**Pour qui, pour quoi.** Ce document s'adresse aux membres du collectif qui participeront au choix de la future palette de couleurs, sans supposer de connaissances en design ou en code. Il présente quatre scénarios de « spectre » (le nuancier complet dont dériveront le site, les rapports, les visuels militants et les graphiques), les compare avec des mesures objectives, et liste les questions qui restent à trancher en réunion.

**Comment le lire.** Dix minutes suffisent en lecture simple. Les réglages interactifs permettent d'explorer des variantes ; on peut les ignorer sans rien perdre. Chaque graphique est suivi d'un guide de lecture. La mémoire de travail du chantier est dans la carte Pawn `projets/nos-services-publics/`.
  </script>
  <script type="text/markdown">
## Les notions utiles, en clair

- **Une couleur a trois dimensions** : sa *teinte* (rouge, bleu, vert... sa position sur la roue des couleurs), sa *clarté* (claire ou foncée) et sa *saturation* (vive ou grisée ; les spécialistes disent « chroma »).
- **OKLCH** est le système de mesure moderne qui décrit les couleurs telles que l'oeil les perçoit. Son intérêt concret : deux couleurs ayant la même clarté OKLCH paraissent réellement aussi claires l'une que l'autre, quelle que soit leur teinte. Les anciens systèmes (le RGB des écrans) ne garantissent pas cela.
- **Les paliers, de 50 à 950** : chaque famille de couleur est déclinée en nuancier, de 50 (presque blanc) à 950 (presque noir). Grâce à OKLCH, un même palier a la même clarté dans toutes les familles : le palier 500 du rouge est aussi clair que le palier 500 du vert.
- **Le contraste** mesure la lisibilité d'une couleur posée sur une autre (un texte sur son fond, par exemple). Les normes d'accessibilité fixent des seuils : 3 pour du texte de grande taille, 4.5 pour du texte courant (le seuil dit « AA »), 7 pour le confort maximal (« AAA »).
- **Le daltonisme** touche environ 8 % des hommes et 0.5 % des femmes, le plus souvent sous forme de confusion entre rouges et verts. On simule ces visions pour vérifier que les graphiques restent lisibles par tout le monde.
- **Le dE (« delta E »)** mesure l'écart perçu entre deux couleurs : en dessous de 5, l'oeil les confond presque ; au-dessus de 12, on les distingue sans effort.

Tout ce qui suit est calculé avec ces outils de mesure ; rien n'est estimé « à l'oeil ».

## Les quatre scénarios

Un scénario, c'est deux choix : *quelles familles de couleurs* composent le spectre, et *quel dosage de saturation* leur donner. Le scénario « médian » est le brouillon issu de la première exploration ; les trois autres balisent l'espace autour de lui : plus proche de l'identité actuelle, plus resserré, ou plus vif. Note : les scénarios ont été dessinés avant la récupération du spectre complet du Printemps ; trois familles retrouvées (bleuet, jasmin, olive) restent à replacer lors de la prochaine itération.

Choisissez un scénario ci-dessous. Les trois réglages suivants sont avancés : ils permettent de tester des variantes de finesse (nombre de paliers) et de saturation ; les ignorer n'enlève rien à la lecture.
  </script>

      label: "Scénario",
      format: (id) => SCENARIOS[id].label
    }));
    const nPaliers = view(Inputs.radio([19, 11], {
      label: "Paliers par famille",
      value: 19
    }));
    const profil = view(Inputs.select(["(du scénario)", "cloche", "plateau", "constant"], {
      label: "Profil de saturation (avancé)"
    }));
    const kGlobal = view(Inputs.range([0.7, 1.3], {
      label: "Intensité de saturation (avancé)",
      step: 0.05, value: 1
    }));
  </script>

      <p><strong>${scenario.label}.</strong> ${scenario.these}</p>
      <p><strong>Ce que ça impliquerait.</strong> ${scenario.implications}</p>
    </div>`);
  </script>

### Rester proche du bleu actuel, ou pas

Le logo du collectif est un bleu pétrole (`#06708E`). La question identitaire centrale de l'arbitrage : le nouveau spectre doit-il contenir ce bleu tel quel (continuité), le contenir à peu près (évolution), ou s'en émanciper (rupture) ? Deux mesures pour objectiver la réponse de chaque scénario.
  </script>

  <script type="text/markdown">
### La règle de lisibilité

Parce que la clarté progresse régulièrement le long des paliers, on obtient une règle simple, applicable sans aucune formation : **deux couleurs du spectre séparées d'un écart suffisant de paliers sont toujours lisibles l'une sur l'autre**, quelles que soient leurs familles. C'est cette règle qu'on pourra transmettre à un ou une bénévole qui compose une affiche ou un visuel : « fond en 100, texte en 600 ou plus », et c'est lisible, garanti.

Le tableau vérifie la règle pour le scénario et les réglages choisis. Sur le brouillon de départ, un écart de 500 garantit le seuil AA du texte courant ; les scénarios plus saturés affaiblissent un peu cette garantie.
  </script>
  <script type="module">
    const cran = ps[1] - ps[0];
    const g = garanties(spectre, [6, 8, 10, 12, 14].filter((d) => d < ps.length));
    display(Inputs.table(g.map((r) => ({
      "écart entre les deux couleurs (en paliers)": r.ecartCrans * cran,
      "contraste garanti": r.contrasteMin,
      "ce que ça permet": r.contrasteMin >= 7 ? "texte, confort maximal (AAA)" : r.contrasteMin >= 4.5 ? "texte courant (AA)" : r.contrasteMin >= 3 ? "texte de grande taille, boutons" : "usage décoratif seulement"
    })), { width: 720 }));
  </script>

### Les couleurs des graphiques

Un graphique à plusieurs séries (une couleur par courbe ou par barre) exige des couleurs que tout le monde distingue, y compris les personnes daltoniennes. Plutôt que de choisir à l'oeil, l'ordinateur cherche la meilleure combinaison : des paliers ni trop clairs ni trop foncés, une saturation suffisante pour ne pas « lire gris », et des écarts maximaux entre couleurs sous les trois formes de daltonisme simulées.

Le sélecteur ci-dessous montre les couleurs telles que les percevrait une personne daltonienne : les séries doivent rester distinguables dans tous les modes.
  </script>

    };

      format: (v) => libellesVision[v]
    }));
  </script>

## Le comparatif d'ensemble

La même batterie de mesures appliquée aux quatre scénarios, dans leur version de référence (19 paliers, sans variation). C'est la table d'arbitrage ; elle est reproductible en ligne de commande par `npm run check`.
  </script>
  <script type="module">
    const rows = Object.entries(SCENARIOS).map(([id, sc]) => {

        "scénario": sc.label,
        "familles": Object.keys(sc.familles).length,

        "contraste garanti à 500 d'écart": gg[1].contrasteMin,
        "distinction des séries (dE)": catL.adjacentMinDE ?? "jeu incomplet",
        "séries de graphique possibles": catL.ordered ? catL.ordered.length : CATEGORIEL[id].length
      };
    });
    display(Inputs.table(rows, { width: 900 }));
    display(html`<div style="max-width:60em;font-size:0.9em;opacity:0.8"><p>Guide de lecture :</p><ul>

      <li><em>Contraste garanti à 500 d'écart</em> : la règle de lisibilité transmissible ; 4.5 et plus = norme AA du texte courant respectée.</li>
      <li><em>Distinction des séries</em> : au-dessus de dE 12, les couleurs de graphiques se distinguent sans effort, daltonisme compris.</li>
    </ul></div>`);
  </script>
  <script type="text/markdown">
## Ce que les mesures nous apprennent

- **La sobriété a un coût sur les graphiques.** Dans le scénario continuité, les bleus tempérés sont trop discrets pour la dataviz : le jeu de séries tombe à 4 couleurs. Un scénario sobre doit soit l'assumer, soit prévoir des variantes saturées dédiées aux graphiques.
- **La vivacité a un coût sur la lisibilité garantie.** Dans le scénario vif, la règle « 500 paliers d'écart = texte lisible » s'affaiblit (contraste 4.25 au lieu de 4.5) : elle devient « 550 paliers d'écart ». L'énergie se paie en simplicité de la règle.
- **Huit familles suffisent.** Le scénario resserré offre les mêmes garanties que le médian avec trois familles de moins : plus simple à gouverner. La seule contrepartie est une réserve de nuances moindre pour thématiser beaucoup de sujets.

## Les questions à trancher en réunion

1. **La distance au bleu actuel** : continuité (le logo vit dans le spectre), évolution, ou rupture assumée ? C'est une question politique et d'attachement, pas une question de calcul.
2. **Le nombre de familles** : la richesse du médian (11) ou la simplicité du resserré (8) ?
3. **Le niveau d'énergie** : accepter d'affaiblir un peu la règle de lisibilité pour gagner en vivacité ?
4. **La finesse du nuancier** : 19 paliers (continuité avec l'existant technique) ou 11 (plus simple à manier au quotidien) ?

Les décisions seront consignées dans la carte Pawn (`exploration-couleurs.md` et `refonte-charte.md`).
  </script>
