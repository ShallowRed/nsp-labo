# Couleurs Nos services publics

Le système de couleurs du collectif : un spectre de 8 familles en 11 paliers, calculé en OKLCH, avec des contrastes garantis et des recettes vérifiées en daltonisme. Ces pages présentent le travail ; les fichiers à utiliser sont listés plus bas, par environnement.

## Comprendre la gamme

- [La gamme de couleurs NSP](./couleurs-showcase) : l'article de référence. Pourquoi une gamme, le nuancier, les usages, les cartes, les échelles pour les graphiques, les contrastes et l'accessibilité.

## Les couleurs des graphiques

- [Palette des graphiques du rapport](./palette-rapport) : les échelles d'opinion et de fréquence en situation, avec le bloc à copier dans R.
- [Catégories sans ordre](./categories-sans-ordre) : les trios de couleurs pour les modalités qu'on ne peut pas classer (versants, usages).

## Les décisions

- [Teintes claires : les variantes comparées](./variantes-teintes-claires) : les six règles essayées pour l'extrémité claire du spectre, et celle retenue le 18 septembre 2026.

## Les fichiers, par environnement

| Environnement | Fichier | Usage |
|---|---|---|
| Tous | [spectre-nsp.csv](https://github.com/ShallowRed/nsp-labo/blob/main/exports/spectre/spectre-nsp.csv) | Les 152 couleurs, en hex et en `oklch()` exact. |
| Web | le même CSV | Le site du collectif en tire ses variables CSS `--color-<famille>-<palier>`. |
| InDesign, Illustrator | [spectre-nsp.ase](https://github.com/ShallowRed/nsp-labo/blob/main/exports/spectre/spectre-nsp.ase) | Nuancier à charger ; [mode d'emploi](https://github.com/ShallowRed/nsp-labo/blob/main/exports/spectre/README.md). |
| Impression | [epreuve-cmjn.csv](https://github.com/ShallowRed/nsp-labo/blob/main/exports/spectre/epreuve-cmjn.csv) | Séparations Coated FOGRA39 et écart ΔE2000 de chaque couleur. |
| R | [kit R](https://github.com/ShallowRed/nsp-labo/blob/main/exports/r) | Thème ggplot et palettes par modalité ; [mode d'emploi](https://github.com/ShallowRed/nsp-labo/blob/main/exports/r/README.md). |

Le code, les générateurs et les contrôles sont dans le dépôt [nsp-labo](https://github.com/ShallowRed/nsp-labo).
