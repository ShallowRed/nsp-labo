# nsp-labo

Expérimentations du collectif Nos Services Publics, en notebooks Observable (Notebook Kit v2, Plot, D3). Chaque exploration est un notebook autonome ; la logique partagée vit dans `lib/`, les données figées dans `data/` avec leur provenance.

## Notebooks

- [Spectre couleurs : scénarios](./couleurs-scenarios) : variations du spectre unifié (nombre de familles, continuité au pétrole, profils de chroma), garanties de contraste et catégoriels dataviz calculés.
- [Spectre couleurs : showcase](./couleurs-showcase) : la version muette pour montrer (deux réglages : scénario, vision) ; nuancier, carte, couvertures, séries, sondage, écart.
- [Enquête hiérarchie : gabarit des figures web](./enquete-hierarchie) : archétypes likert divergent et haltère d'écart aux couleurs du spectre, daltonisme simulé ; le kit R miroir pour la chaîne d'analyse est dans `exports/r/`.

## Autres racines servies

Ce serveur (`pnpm preview`, port 5173) ne sert que ce dossier `notebooks/` : c'est un serveur Observable Notebook Kit, il ne peut pas exposer le reste du repo. Deux autres racines existent, chacune sur son port :

- Maquettes de charte (`mockups/`) : `python3 -m http.server --directory mockups 18798` (ou la config `charte-mockups` du `launch.json` de garden), sommaire sur `http://localhost:18798/`.
- Pendant web du rapport enquête (`exports/web/`) : `python3 -m http.server --directory exports/web 18796` (config `enquete-web-poc`), sommaire sur `http://localhost:18796/`.

## Contexte

La mémoire de travail du chantier (couches constat / partagé / positions) est dans la carte Pawn `shallowred-garden/agents/workspace-pawn/content/projets/nos-services-publics/`.
