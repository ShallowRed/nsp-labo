# nsp-labo

Expérimentations du collectif Nos Services Publics, en notebooks Observable (Notebook Kit v2, Plot, D3). Chaque exploration est un notebook autonome ; la logique partagée vit dans `lib/`, les données figées dans `data/` avec leur provenance.

## Notebooks

- [Spectre couleurs NSP](./couleurs-showcase) : le spectre acté le 23 juillet 2026 (resserré, 8 familles) : nuancier, gammes de dataviz avec écarts mesurés, fond sombre, carte, couvertures, séries, sondage ; daltonisme simulé sur tout le notebook. L'exploration comparative qui a mené à la décision est consignée dans la carte Pawn (notebook comparateur retiré, historique git).
- [Charte graphiques : correspondance](./charte-graphiques) : mapping direct de la charte couleurs graphiques de la maquettiste vers le spectre : quatre règles au lieu de seize lignes, correspondance ligne à ligne, avant/après sur deux vraies figures du rapport.
- [Enquête hiérarchie : gabarit des figures web](./enquete-hierarchie) : archétypes likert divergent et haltère d'écart aux couleurs du spectre, daltonisme simulé ; le kit R miroir pour la chaîne d'analyse est dans `exports/r/`.

## Autre racine servie

Ce serveur (`npm run preview`, port 5173) ne sert que ce dossier `notebooks/` : c'est un serveur Observable Notebook Kit, il ne peut pas exposer le reste du repo. Le pendant web du rapport enquête (`exports/web/`) tourne à part : `python3 -m http.server --directory exports/web 18796` (config `enquete-web-poc`), sommaire sur `http://localhost:18796/`.

## Contexte

La mémoire de travail du chantier (couches constat / partagé / positions) est dans la carte Pawn `shallowred-garden/agents/workspace-pawn/content/projets/nos-services-publics/`.
