# nsp-labo

Expérimentations du collectif Nos Services Publics, en notebooks Observable (Notebook Kit v2, Plot, D3). Chaque exploration est un notebook autonome ; la logique partagée vit dans `lib/`, les données figées dans `data/` avec leur provenance.

## Notebooks

Trois notebooks, trois rôles :

- [Le spectre de couleurs NSP](./couleurs-showcase) : **la référence**. La gamme arrêtée le 23 juillet 2026 (8 familles du clair au foncé), les trois gammes des graphiques avec leurs écarts mesurés, le fond sombre, et trois mises en situation (carte, couvertures, séries). Daltonisme simulable partout.
- [Charte des graphiques : la correspondance](./charte-graphiques) : **la traduction pour le rapport**. Chaque ligne de la charte de la maquettiste traduite vers le spectre, quatre règles au lieu de seize lignes, avant/après sur deux vraies figures.
- [Enquête hiérarchie : gabarit des figures web](./enquete-hierarchie) : **la forme des futures figures web**. Les deux formes qui couvrent l'essentiel du rapport (réponses graduées en miroir, haltère d'écart), aux couleurs du spectre ; le kit R miroir pour la chaîne d'analyse est dans `exports/r/`.

## Autre racine servie

Ce serveur (`npm run preview`, port 5173) ne sert que ce dossier `notebooks/` : c'est un serveur Observable Notebook Kit, il ne peut pas exposer le reste du repo. Le pendant web du rapport enquête (`exports/web/`) tourne à part : `python3 -m http.server --directory exports/web 18796` (config `enquete-web-poc`), sommaire sur `http://localhost:18796/`.

## Contexte

La mémoire de travail du chantier (couches constat / partagé / positions) est dans la carte Pawn `shallowred-garden/agents/workspace-pawn/content/projets/nos-services-publics/`.
