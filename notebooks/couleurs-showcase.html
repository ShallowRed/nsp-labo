<!doctype html>
<notebook>
  <title>Spectre couleurs NSP</title>
  <script type="text/markdown">
# Spectre couleurs NSP 2026

Le spectre acté le 23 juillet 2026 (« resserré », 8 familles), décliné sur les usages courants. Le sélecteur de vision simule les trois formes de daltonisme : tout le notebook se recolore, les garanties se vérifient à l'œil.
  </script>
  <script type="module">
    import { Plot, html } from "./lib/deps.js";
    import { SCENARIOS, CATEGORIEL } from "./lib/scenarios.js";
    import { genSpectre, paliers, bestCategorical, categorielEtendu, simulate, dE } from "./lib/spectre.js";
    import { franceMetropolitaine } from "./lib/carte.js";
    const topoShow = await FileAttachment("data/departements.json").json();
    const carteFond = franceMetropolitaine(topoShow);
    const ps19 = paliers(19);
  </script>
  <script type="module">
    const visionShow = view(Inputs.select(
      new Map([["vision normale", "normal"], ["deutéranopie", "deutan"], ["protanopie", "protan"], ["tritanopie", "tritan"]]),
      { label: "Vision" }
    ));
  </script>
  <script type="module">
    const spShow = genSpectre(SCENARIOS.resserre);
    const voir = (hex) => (visionShow === "normal" ? hex : simulate(hex, visionShow));
    const tShow = (fam, palier) => spShow[fam]?.[ps19.indexOf(palier)];
    const encreShow = voir(tShow("ardoise", 800) ?? tShow("petrole", 800));
    // pire écart entre aplats adjacents, daltonisme compris (seuil de confort : 10)
    const pireAdj = (hexes) => {
      let w = Infinity;
      for (const m of ["normal", "protan", "deutan", "tritan"])
        for (let i = 0; i + 1 < hexes.length; i++)
          w = Math.min(w, dE(simulate(hexes[i], m), simulate(hexes[i + 1], m)));
      return +w.toFixed(1);
    };
    // rangée de nuancier annotée, réutilisée par toutes les gammes
    const rangee = (titre, hexes, note = "") => html`<div style="margin: 0 0 14px;">
      <div style="display:flex; align-items:baseline; gap:8px; margin-bottom:4px;">
        <span style="font-size:0.82em; font-weight:600;">${titre}</span>
        <span style="font-size:0.75em; color:#777;">${note}</span>
      </div>
      <div style="display:flex; gap:3px; max-width:520px;">
        ${hexes.map((h) => html`<div style="flex:1; height:30px; border-radius:3px; background:${voir(h)};"></div>`)}
      </div>
    </div>`;
  </script>
  <script type="text/markdown">
## Le spectre
  </script>
  <script type="module">
    display(html`<div style="display:grid; gap:6px;">
      ${Object.entries(spShow).map(([fam, arr]) => html`<div style="display:flex; align-items:center; gap:8px;">
        <span style="width:6.5em; font-size:0.8em; text-align:right; color:#555;">${fam}</span>
        <div style="display:flex; gap:3px; flex:1;">
          ${arr.map((hex) => html`<div style="flex:1; aspect-ratio:1; border-radius:3px; background:${voir(hex)};"></div>`)}
        </div>
      </div>`)}
    </div>`);
  </script>
  <script type="text/markdown">
## Trois gammes pour trois questions

Tout graphique pose une des trois questions suivantes, et chaque question a sa gamme, dérivée du spectre. Les gammes discrètes affichent leur pire écart entre voisins, daltonisme compris (dE, confort au-dessus de 10).

**Combien ?** Une intensité (durée, densité, fréquence) : gamme **séquentielle**, une seule famille du clair au foncé. Chaque famille fournit la sienne, ce qui permet de thémiser par sujet.
  </script>
  <script type="module">
    const seq = (fam) => [150, 300, 450, 600, 750].map((p) => tShow(fam, p));
    display(html`<div>
      ${rangee("pétrole", seq("petrole"))}
      ${rangee("canard", seq("canard"))}
      ${rangee("framboise", seq("framboise"))}
    </div>`);
  </script>
  <script type="text/markdown">
**De quel côté ?** Un axe négatif-positif (opinion, écart à une cible) : gamme **divergente**, deux pôles autour d'un centre. Le pôle chaud est le coquelicot, le pôle froid le canard (la couleur d'identité) : pas d'axe rouge-vert, illisible en daltonisme. Autre piège mesuré ici : en 5 modalités, un pivot moutarde se confond avec le pôle chaud (dE 7) là où un pivot neutre clair tient (dE 15).
  </script>
  <script type="module">
    const lik4 = [tShow("coquelicot", 600), tShow("coquelicot", 300), tShow("canard", 450), tShow("canard", 600)];
    const lik5 = [tShow("coquelicot", 600), tShow("coquelicot", 300), tShow("ardoise", 100), tShow("canard", 450), tShow("canard", 600)];
    const lik5moutarde = [tShow("coquelicot", 600), tShow("coquelicot", 300), tShow("ambre", 300), tShow("canard", 450), tShow("canard", 600)];
    const ouiNon = [tShow("canard", 450), tShow("coquelicot", 500), tShow("ardoise", 150)];
    const cont7 = [tShow("coquelicot", 700), tShow("coquelicot", 450), tShow("coquelicot", 200), tShow("ardoise", 100), tShow("canard", 200), tShow("canard", 450), tShow("canard", 700)];
    display(html`<div>
      ${rangee("4 modalités (likert)", lik4, `pire écart ${pireAdj(lik4)}`)}
      ${rangee("5 modalités, pivot neutre", lik5, `pire écart ${pireAdj(lik5)}`)}
      ${rangee("5 modalités, pivot moutarde (contre-exemple)", lik5moutarde, `pire écart ${pireAdj(lik5moutarde)} : à éviter`)}
      ${rangee("oui / non / ne sait pas", ouiNon, `pire écart ${pireAdj(ouiNon)}`)}
      ${rangee("continue (7 classes ordonnées)", cont7, "la lecture est l'ordre, pas l'identification")}
    </div>`);
  </script>
  <script type="text/markdown">
**Qui est qui ?** Des catégories sans ordre (thématiques, services, régions) : gamme **catégorielle**. Le jeu et son ordre sont calculés sous contraintes (bande de clarté, plancher de saturation, séparation en vision daltonienne comprise), pas choisis à l'œil.
  </script>
  <script type="module">
    const catShow = bestCategorical(spShow, CATEGORIEL.resserre, { mode: "light", ps: ps19 });
    display(html`<div style="display:flex; gap:10px; flex-wrap:wrap;">
      ${catShow.ordered.map((c) => html`<div style="text-align:center;">
        <div style="width:64px; height:44px; border-radius:4px; background:${voir(c.hex)};"></div>
        <div style="font-size:0.7em; color:#555; margin-top:3px;">${c.famille} ${c.palier}</div>
      </div>`)}
    </div>
    <p style="font-size:0.78em; color:#777; margin-top:8px;">Six séries, pire écart entre voisines ${catShow.adjacentMinDE} toutes visions confondues.</p>`);
  </script>
  <script type="text/markdown">
## Doubler les catégories : douze séries

Quand six séries ne suffisent pas, le générateur fabrique des teintes **intermédiaires** (à mi-chemin de deux familles voisines, clarté alternée), puis désordonne l'ensemble pour que deux voisines restent toujours très distinctes. L'effet est riche mais reste organisé : mêmes courbes de clarté, même saturation de référence.
  </script>
  <script type="module">
    const douze = categorielEtendu(SCENARIOS.resserre, CATEGORIEL.resserre, { ps: ps19 });
    const douzeSeries = douze.ordered.map((c, i) => ({
      serie: c.nom,
      valeur: [34, 31, 28, 26, 23, 21, 18, 16, 13, 11, 9, 7][i] ?? 6,
      couleur: visionShow === "normal" ? c.hex : c.sims[visionShow],
    }));
    display(Plot.plot({
      width: 640, height: 60 + douzeSeries.length * 30, marginLeft: 170,
      x: { label: "part (%)", grid: true },
      y: { label: null },
      color: { type: "identity" },
      marks: [
        Plot.barX(douzeSeries, { y: "serie", x: "valeur", fill: "couleur", sort: null }),
        Plot.text(douzeSeries, { y: "serie", x: "valeur", text: (d) => `${d.valeur}`, dx: 12, fill: encreShow }),
      ],
    }));
    display(html`<p style="font-size:0.78em; color:#777;">Pire écart entre voisines ${douze.adjacentMinDE} (toutes visions). Honnêteté : sur douze séries, toutes les paires ne peuvent plus être garanties en daltonisme (${douze.allPairsMinDE} au pire entre deux séries éloignées) : au-delà de six catégories, l'identification passe par la légende et l'adjacence, c'est vrai de tout système de couleurs.</p>`);
  </script>
  <script type="text/markdown">
## Fond sombre

Le même calcul, contraint sur la bande de clarté qui tient sur un fond foncé : les surfaces sombres (réseaux sociaux, écrans militants) ont leur jeu catégoriel dédié, dérivé du même spectre.
  </script>
  <script type="module">
    const catSombre = bestCategorical(spShow, CATEGORIEL.resserre, { mode: "dark", ps: ps19 });
    const fondSombre = tShow("ardoise", 900);
    display(html`<div style="background:${fondSombre}; border-radius:8px; padding:22px;">
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        ${catSombre.ordered.map((c) => html`<div style="text-align:center;">
          <div style="width:64px; height:44px; border-radius:4px; background:${voir(c.hex)};"></div>
          <div style="font-size:0.7em; color:#aab; margin-top:3px;">${c.famille} ${c.palier}</div>
        </div>`)}
      </div>
    </div>
    <p style="font-size:0.78em; color:#777; margin-top:8px;">Pire écart entre voisines ${catSombre.adjacentMinDE} sur fond ardoise 900.</p>`);
  </script>
  <script type="text/markdown">
## En situation : carte
  </script>
  <script type="module">
    const famCarteShow = spShow.lavande ?? spShow.canard ?? spShow.petrole;
    const rampShow = [2, 5, 8, 11, 14].map((i) => voir(famCarteShow[i]));
    const valShow = (f) => {
      let h = 0;
      for (const ch of f.properties.INSEE_DEP) h = (h * 31 + ch.charCodeAt(0)) % 997;
      return 5 + (h % 26);
    };
    display(Plot.plot({
      projection: { type: "conic-conformal", rotate: [-3, 0], parallels: [44, 49], domain: carteFond },
      width: 480, height: 460,
      color: { type: "quantile", n: 5, range: rampShow, label: "minutes (fictif)", legend: true },
      marks: [Plot.geo(carteFond, { fill: (d) => valShow(d), stroke: voir(famCarteShow[14]), strokeWidth: 0.5 })],
    }));
  </script>
  <script type="text/markdown">
## En situation : couvertures thématiques
  </script>
  <script type="module">
    const themesShow = ["Santé", "Éducation", "Transports", "Justice", "Logement", "Écologie"];
    const famsShow = Object.keys(spShow).filter((f) => f !== "ardoise");
    display(html`<div style="display:flex; gap:14px; flex-wrap:wrap;">
      ${themesShow.map((theme, i) => {
        const f = famsShow[i % famsShow.length];
        return html`<svg width="126" height="178" viewBox="0 0 150 212">
          <rect width="150" height="212" rx="4" fill="${voir(tShow(f, 100))}"/>
          <rect width="150" height="132" rx="4" fill="${voir(tShow(f, 550))}"/>
          <path d="M 95 -30 A 85 85 0 0 1 40 105" fill="none" stroke="${voir(tShow(f, 400))}" stroke-width="13" opacity="0.55"/>
          <text x="12" y="22" font-size="8.5" font-weight="700" fill="white" font-family="system-ui">Nos services publics</text>
          <text x="12" y="186" font-size="15" font-weight="700" fill="${voir(tShow(f, 550))}" font-family="system-ui">${theme}</text>
        </svg>`;
      })}
    </div>`);
  </script>
  <script type="text/markdown">
## En situation : séries et sondage
  </script>
  <script type="module">
    const catSix = bestCategorical(spShow, CATEGORIEL.resserre, { mode: "light", ps: ps19 });
    const seriesShow = catSix.ordered.map((c, i) => ({
      serie: `${c.famille} ${c.palier}`,
      valeur: [34, 27, 22, 17, 12, 9][i] ?? 8,
      couleur: c.sims[visionShow],
    }));
    display(Plot.plot({
      width: 640, height: 60 + seriesShow.length * 38, marginLeft: 130,
      x: { label: "part (%)", grid: true },
      y: { label: null },
      color: { type: "identity" },
      marks: [
        Plot.barX(seriesShow, { y: "serie", x: "valeur", fill: "couleur" }),
        Plot.text(seriesShow, { y: "serie", x: "valeur", text: (d) => `${d.valeur}`, dx: 14, fill: encreShow }),
      ],
    }));
  </script>
  <script type="module">
    const modShow = [
      { nom: "mal", c: tShow("coquelicot", 600) },
      { nom: "plutôt mal", c: tShow("coquelicot", 300) },
      { nom: "plutôt bien", c: tShow("canard", 450) },
      { nom: "bien", c: tShow("canard", 600) },
    ];
    const repShow = {
      "en général": { "mal": 7, "plutôt mal": 19, "plutôt bien": 57, "bien": 17 },
      "au travail": { "mal": 14, "plutôt mal": 31, "plutôt bien": 45, "bien": 10 },
    };
    const segShow = Object.entries(repShow).flatMap(([ctx, rep]) => {
      let gauche = -(rep["mal"] + rep["plutôt mal"]);
      return modShow.map((m) => {
        const seg = { ctx, x0: gauche, x1: gauche + rep[m.nom], c: voir(m.c), pct: rep[m.nom] };
        gauche += rep[m.nom];
        return seg;
      });
    });
    display(Plot.plot({
      width: 640, height: 150, marginLeft: 90,
      x: { label: null, domain: [-60, 80], tickFormat: (d) => Math.abs(d) },
      y: { label: null },
      color: { type: "identity" },
      marks: [
        Plot.barX(segShow, { y: "ctx", x1: "x0", x2: "x1", fill: "c", insetTop: 6, insetBottom: 6 }),
        Plot.text(segShow.filter((s) => s.pct >= 7), { y: "ctx", x: (s) => (s.x0 + s.x1) / 2, text: (s) => `${s.pct}`, fill: "white", fontWeight: 600 }),
        Plot.ruleX([0], { stroke: encreShow }),
      ],
    }));
  </script>
