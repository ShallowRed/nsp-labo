# La gamme de couleurs NSP

**Pourquoi poser une gamme de couleur.** Le collectif met régulièrement en forme des productions print et web, autour de l'identité graphique initiale NSP. La gamme existante (autour d'un bleu pétrole) est un chouille tristounette : elle mérite d'être à minima vivifiée, sinon remplacée, pour dynamiser l'image de marque du collectif. Elle ne prévoit pas non plus de règles pour couvrir des cas d'usages récurrents : colorier selon des thématiques de politique publique, représenter des graphiques. On se retrouve à réinventer des couleurs à chaque projet : chronophage et pas harmonieux. Enfin, NSP est souvent amené à participer ou coordonner des initiatives sous d'autres identités visuelles (campagnes ponctuelles, coalitions), qui gagneraient à être rapprochées visuellement pour créer plus de cohérence.

**Ce dont on a besoin** : des couleurs plus **vives** et joyeuses ; des couleurs **nombreuses**, qui permettent des sous-ensembles par projet ; des couleurs adaptées au **multimédia** ; des couleurs **accessibles** by design ; un **cadre clair** pour leurs usages et déclinaisons.

**La proposition**, arrêtée le 23 juillet 2026 : un spectre complet de couleurs, consolidé des expériences du Printemps des services publics et du RESP 2025. **8 familles** (une teinte déclinée du presque blanc au presque noir), repérées par des **paliers** de 50 (le plus clair) à 950 (le plus foncé). C'est une couche de design relativement indépendante de la suite de la refonte : on arrête maintenant une palette, on l'utilise dans le rapport management comme premier cas d'usage, on variabilise et on s'autorise à faire évoluer au besoin ; d'autres gestes de design (typos, compositions) viendront par-dessus.

Chaque section a son sélecteur de vision : « vision typique », ou l'une des trois formes de daltonisme pour vérifier à l'œil que tout reste lisible.
  </script>
  <script type="module">
    import { Plot, html, formatHex, clampChroma, converter, geoCentroid } from "./lib/deps.js";
    import { SCENARIOS, CATEGORIEL } from "./lib/scenarios.js";
    import { genSpectre, paliers, bestCategorical, categorielEtendu, simulate, dE, garanties } from "./lib/spectre.js";
    import { bande } from "./lib/bandes.js";
    import { FIGURES } from "./lib/charte-tramanh.js";
    import { franceMetropolitaine } from "./lib/carte.js";
    const topoShow = await FileAttachment("data/departements.json").json();
    const carteFond = franceMetropolitaine(topoShow);
    const ps19 = paliers(19);
    const spShow = genSpectre(SCENARIOS.resserre);
    const tShow = (fam, palier) => spShow[fam]?.[ps19.indexOf(palier)];
    const selVision = () => Inputs.select(
      new Map([["vision typique", "normal"], ["deutéranopie (rouge-vert, la plus courante)", "deutan"], ["protanopie (rouge-vert)", "protan"], ["tritanopie (bleu-jaune, rare)", "tritan"]]),
      { label: "Vision" }
    );
    const simVoir = (mode) => (hex) => (mode === "normal" ? hex : simulate(hex, mode));
    // le mapping thématique -> famille, le même partout (couvertures, carte)
    const THEMES = [
      ["Santé", "canard"], ["Éducation", "ambre"], ["Transports", "petrole"],
      ["Justice", "lavande"], ["Logement", "coquelicot"], ["Écologie", "prairie"],
    ];
    // écart perçu minimal entre deux couleurs voisines d'une gamme, daltonisme compris ;
    // au-dessus de 10, on ne les confond pas
    const ecart = (hexes) => {
      let w = Infinity;
      for (const m of ["normal", "protan", "deutan", "tritan"])
        for (let i = 0; i + 1 < hexes.length; i++)
          w = Math.min(w, dE(simulate(hexes[i], m), simulate(hexes[i + 1], m)));
      return w.toFixed(0);
    };
  </script>

## Cartographies

Même logique appliquée à une carte : la famille d'une thématique devient une échelle de densité. L'échelle divergente sert un autre message, l'écart à la moyenne nationale. Données illustratives : un temps d'accès qui augmente en s'éloignant des grandes villes.
  </script>
  <script type="module">
    const visionCarte = view(selVision());
    const echelleCarte = view(Inputs.radio(
      new Map([
        ["monochrome canard (ex. santé)", "canard"],
        ["monochrome lavande (ex. justice)", "lavande"],
        ["monochrome ambre (ex. éducation)", "ambre"],
        ["divergente : écart à la moyenne", "divergente"],
      ]),
      { label: "Échelle", value: "canard" }
    ));
  </script>
  <script type="module">
    const voirCa = simVoir(visionCarte);
    // valeur illustrative mais réaliste : un gradient spatial (temps d'accès qui augmente
    // en s'éloignant des grandes villes) plutôt qu'un bruit aléatoire
    const villes = [[2.35, 48.85], [4.85, 45.75], [5.37, 43.3], [-0.58, 44.84], [3.06, 50.63], [7.75, 48.58], [-1.55, 47.22]];
    const minutes = new Map(carteFond.features.map((f) => {
      const [x, y] = geoCentroid(f);
      const dmin = Math.min(...villes.map(([vx, vy]) => Math.hypot(x - vx, y - vy)));
      let h = 0;
      for (const ch of f.properties.INSEE_DEP) h = (h * 31 + ch.charCodeAt(0)) % 97;
      return [f.properties.INSEE_DEP, Math.round(9 + dmin * 6.5 + (h % 9))];
    }));
    const moyenne = [...minutes.values()].reduce((a, b) => a + b, 0) / minutes.size;
    const seq = (fam) => [100, 300, 500, 700, 850].map((p) => voirCa(tShow(fam, p)));
    const divg = [tShow("canard", 600), tShow("canard", 300), tShow("ardoise", 100), tShow("coquelicot", 300), tShow("coquelicot", 600)].map(voirCa);
    const enDivergente = echelleCarte === "divergente";
    const valeur = (f) => {
      const v = minutes.get(f.properties.INSEE_DEP);
      return enDivergente ? v - moyenne : v;
    };
    display(Plot.plot({
      projection: { type: "conic-conformal", rotate: [-3, 0], parallels: [44, 49], domain: carteFond },
      width: 500, height: 470,
      color: enDivergente
        ? { type: "quantile", n: 5, range: divg, label: "écart à la moyenne (min)", legend: true, tickFormat: (d) => (d > 0 ? `+${d.toFixed(0)}` : d.toFixed(0)) }
        : { type: "quantile", n: 5, range: seq(echelleCarte), label: "temps d'accès (min)", legend: true, tickFormat: (d) => d.toFixed(0) },
      marks: [Plot.geo(carteFond, { fill: valeur, stroke: "white", strokeWidth: 0.5,
        tip: true, title: (f) => `${f.properties.INSEE_DEP} : ${minutes.get(f.properties.INSEE_DEP)} min` })],
    }));
  </script>

  <script type="text/markdown">
## Des couleurs uniformément perceptibles

Les couleurs sont réglées dans un espace (**OKLCH**) construit pour correspondre à ce que l'œil perçoit, pas à un calcul arbitraire. Deux couleurs à la même clarté réglée sont perçues **aussi claires l'une que l'autre**, quelle que soit leur teinte. C'est ce qui rend les paliers du nuancier et les garanties de contraste fiables mécaniquement, pas seulement ajustés à l'œil.
  </script>
  <script type="module">
    const toRgbU = converter("rgb");
    // les sept teintes chromatiques du spectre, dans chaque espace
    const huesU = Object.entries(SCENARIOS.resserre.familles)
      .filter(([n]) => n !== "ardoise").map(([, f]) => f.H).sort((a, b) => a - b);
    const rowHsl = huesU.map((h) => formatHex({ mode: "hsl", h, s: 0.75, l: 0.5 }));
    const rowOk = huesU.map((h) => formatHex(toRgbU(clampChroma({ mode: "oklch", l: 0.72, c: 0.14, h }, "rgb"))));
    display(html`<div>
      <div style="font-size:0.82em; margin-bottom:2px;"><strong>HSL</strong> <span style="color:#777;">les sept teintes du spectre à la même « clarté » réglée : perçues très inégales</span></div>
      ${bande(rowHsl)}
      <div style="font-size:0.82em; margin:10px 0 2px;"><strong>OKLCH</strong> <span style="color:#777;">les mêmes, même clarté réglée, même clarté perçue</span></div>
      ${bande(rowOk)}
    </div>`);
  </script>
  <script type="text/markdown">
À réglage de clarté identique, l'espace HSL (le plus courant) trompe l'œil ; OKLCH corrige ce défaut par construction.

## Accessibilité

Aujourd'hui, la majorité des figures de l'enquête oppose un vert et un rouge : **illisible pour un lecteur daltonien**. Le spectre corrige ça par construction, preuve simulée à l'appui : ci-dessous, une vraie figure du rapport, mêmes données, couleurs actuelles puis couleurs du spectre. Passer le sélecteur en deutéranopie.
  </script>
  <script type="module">
    const visionFig = view(selVision());
  </script>
  <script type="module">
    const voirF = simVoir(visionFig);
    const fig = FIGURES.find((f) => f.titre.includes("consignes"));
    const hexDe = ([fam, palier]) => tShow(fam, palier);
    const figChart = (palette, label) => {
      const cols = palette.map(voirF);
      const seg = Object.entries(fig.lignes).flatMap(([ctx, vals]) => {
        let x = 0;
        return vals.map((v, i) => {
          const s = { ctx, x0: x, x1: x + v, c: cols[i], v };
          x += v;
          return s;
        });
      });
      return html`<div style="margin:0 0 18px;">
        <div style="font-size:0.78em; font-weight:600; color:#666; margin-bottom:2px;">${label}</div>
        ${Plot.plot({
          width: 620, height: 34 + Object.keys(fig.lignes).length * 32, marginLeft: 84,
          x: { label: null, domain: [0, 100] },
          y: { label: null, domain: Object.keys(fig.lignes) },
          color: { type: "identity" },
          marks: [
            Plot.barX(seg, { y: "ctx", x1: "x0", x2: "x1", fill: "c", insetTop: 3, insetBottom: 3 }),
            Plot.text(seg.filter((s) => s.v >= 6), { y: "ctx", x: (s) => (s.x0 + s.x1) / 2, text: (s) => `${s.v}`, fill: "white", fontSize: 11 }),
          ],
        })}
      </div>`;
    };
    display(html`<div>
      <div style="font-weight:700; font-size:0.9em; margin:6px 0 4px;">${fig.titre}</div>
      <div style="font-size:0.75em; color:#888; margin-bottom:6px;">${fig.modalites.join(" · ")}</div>
      ${figChart(fig.avant, "couleurs actuelles")}
      ${figChart(fig.apres.map(hexDe), "couleurs du spectre")}
    </div>`);
  </script>
