<!doctype html>
<notebook>
  <title>Le spectre de couleurs NSP</title>
  <script type="text/markdown">
# Le spectre de couleurs NSP

La gamme de couleurs du collectif, arrêtée le 23 juillet 2026 : **8 familles** (une teinte, déclinée du presque blanc au presque noir), repérées par des **paliers** de 50 (le plus clair) à 950 (le plus foncé). Toutes les combinaisons montrées ici sont vérifiées par calcul, y compris pour les trois formes de daltonisme : le sélecteur ci-dessous recolore tout le notebook comme les verrait un lecteur concerné.
  </script>
  <script type="module">
    import { Plot, html } from "./lib/deps.js";
    import { SCENARIOS, CATEGORIEL } from "./lib/scenarios.js";
    import { genSpectre, paliers, bestCategorical, simulate, dE } from "./lib/spectre.js";
    import { bande, bandeNommee } from "./lib/bandes.js";
    import { franceMetropolitaine } from "./lib/carte.js";
    const topoShow = await FileAttachment("data/departements.json").json();
    const carteFond = franceMetropolitaine(topoShow);
    const ps19 = paliers(19);
  </script>
  <script type="module">
    const visionShow = view(Inputs.select(
      new Map([["vision normale", "normal"], ["deutéranopie (rouge-vert, la plus courante)", "deutan"], ["protanopie (rouge-vert)", "protan"], ["tritanopie (bleu-jaune, rare)", "tritan"]]),
      { label: "Vision" }
    ));
  </script>
  <script type="module">
    const spShow = genSpectre(SCENARIOS.resserre);
    const voir = (hex) => (visionShow === "normal" ? hex : simulate(hex, visionShow));
    const tShow = (fam, palier) => spShow[fam]?.[ps19.indexOf(palier)];
    const encreShow = voir(tShow("ardoise", 800));
    // écart perçu minimal entre deux couleurs voisines d'une gamme, daltonisme compris ;
    // au-dessus de 10, on ne les confond pas
    const ecart = (hexes) => {
      let w = Infinity;
      for (const m of ["normal", "protan", "deutan", "tritan"])
        for (let i = 0; i + 1 < hexes.length; i++)
          w = Math.min(w, dE(simulate(hexes[i], m), simulate(hexes[i + 1], m)));
      return w.toFixed(0);
    };
    const gamme = (titre, hexes, note = "") => html`<div style="margin: 0 0 10px;">
      <div style="font-size:0.82em; margin-bottom:2px;"><strong>${titre}</strong> <span style="color:#777;">${note}</span></div>
      ${bande(hexes.map(voir))}
    </div>`;
  </script>
  <script type="text/markdown">
## Le nuancier

Chaque case est une couleur du spectre. Survoler une case donne sa famille, son palier et son code.
  </script>
  <script type="module">
    const cases = Object.entries(spShow).flatMap(([famille, arr]) =>
      arr.map((hex, i) => ({ famille, palier: ps19[i], hex })));
    display(Plot.plot({
      width: 680, height: 8 * 30 + 46, marginLeft: 78,
      x: { label: "palier (clair vers foncé)", tickValues: [50, 200, 350, 500, 650, 800, 950] },
      y: { label: null, domain: Object.keys(spShow) },
      color: { type: "identity" },
      marks: [Plot.cell(cases, {
        x: "palier", y: "famille", fill: (d) => voir(d.hex), rx: 3, inset: 1,
        tip: true, title: (d) => `${d.famille} ${d.palier}\n${d.hex}`,
      })],
    }));
  </script>
  <script type="text/markdown">
## Les trois gammes des graphiques

Un graphique utilise la couleur pour répondre à une question, et chaque question a sa gamme. Sous les gammes à cases, un chiffre : le plus petit écart perçu entre deux voisines, daltonisme compris. Au-dessus de 10, on ne peut pas les confondre.

**Représenter une quantité** (durée, densité, fréquence) : une seule famille, du clair au foncé.
  </script>
  <script type="module">
    display(gamme("séquentielle (pétrole)", [150, 300, 450, 600, 750].map((p) => tShow("petrole", p))));
  </script>
  <script type="text/markdown">
**Représenter une opinion entre deux pôles** : le chaud (coquelicot) porte le négatif, le froid (canard) le positif. Jamais de rouge contre vert : c'est la paire que le daltonisme efface. Autre piège mesuré : en 5 réponses, un milieu jaune-orangé se confond avec le pôle chaud, un milieu gris clair reste net.
  </script>
  <script type="module">
    const lik4 = [tShow("coquelicot", 600), tShow("coquelicot", 300), tShow("canard", 450), tShow("canard", 600)];
    const lik5 = [tShow("coquelicot", 600), tShow("coquelicot", 300), tShow("ardoise", 100), tShow("canard", 450), tShow("canard", 600)];
    const lik5moutarde = [tShow("coquelicot", 600), tShow("coquelicot", 300), tShow("ambre", 300), tShow("canard", 450), tShow("canard", 600)];
    const ouiNon = [tShow("canard", 450), tShow("coquelicot", 500), tShow("ardoise", 150)];
    display(html`<div>
      ${gamme("4 réponses graduées", lik4, `écart ${ecart(lik4)}`)}
      ${gamme("5 réponses, milieu gris clair", lik5, `écart ${ecart(lik5)}`)}
      ${gamme("5 réponses, milieu jaune-orangé", lik5moutarde, `écart ${ecart(lik5moutarde)} : à éviter`)}
      ${gamme("oui, non, ne sait pas", ouiNon, `écart ${ecart(ouiNon)}`)}
    </div>`);
  </script>
  <script type="text/markdown">
**Distinguer des choses sans ordre** (thématiques, services, régions) : six couleurs choisies dans une clarté moyenne et ordonnées par calcul pour que deux voisines restent reconnaissables, daltonisme compris.
  </script>
  <script type="module">
    const catShow = bestCategorical(spShow, CATEGORIEL.resserre, { mode: "light", ps: ps19 });
    display(bandeNommee(catShow.ordered.map((c) => ({ nom: `${c.famille} ${c.palier}`, hex: voir(c.hex) }))));
  </script>
  <script type="text/markdown">
## Sur fond sombre

Les mêmes six rôles, recalculés pour rester lisibles sur un fond foncé (réseaux sociaux, affiches).
  </script>
  <script type="module">
    const catSombre = bestCategorical(spShow, CATEGORIEL.resserre, { mode: "dark", ps: ps19 });
    display(bandeNommee(
      catSombre.ordered.map((c) => ({ nom: `${c.famille} ${c.palier}`, hex: voir(c.hex) })),
      { fond: tShow("ardoise", 900) }
    ));
  </script>
  <script type="text/markdown">
## En situation : une carte

La gamme « quantité » appliquée à une carte (valeurs fictives) : une seule famille, cinq niveaux de clarté.
  </script>
  <script type="module">
    const famCarteShow = spShow.lavande;
    const rampShow = [2, 5, 8, 11, 14].map((i) => voir(famCarteShow[i]));
    const valShow = (f) => {
      let h = 0;
      for (const ch of f.properties.INSEE_DEP) h = (h * 31 + ch.charCodeAt(0)) % 997;
      return 5 + (h % 26);
    };
    display(Plot.plot({
      projection: { type: "conic-conformal", rotate: [-3, 0], parallels: [44, 49], domain: carteFond },
      width: 480, height: 460,
      color: { type: "quantile", n: 5, range: rampShow, label: "minutes (fictif)", legend: true },
      marks: [Plot.geo(carteFond, { fill: (d) => valShow(d), stroke: voir(famCarteShow[14]), strokeWidth: 0.5 })],
    }));
  </script>
  <script type="text/markdown">
## En situation : des couvertures

Une famille par politique publique, même gabarit : la collection se reconnaît en rayon.
  </script>
  <script type="module">
    const themesShow = ["Santé", "Éducation", "Transports", "Justice", "Logement", "Écologie"];
    const famsShow = Object.keys(spShow).filter((f) => f !== "ardoise");
    display(html`<div style="display:flex; gap:14px; flex-wrap:wrap;">
      ${themesShow.map((theme, i) => {
        const f = famsShow[i % famsShow.length];
        return html`<svg width="126" height="178" viewBox="0 0 150 212">
          <rect width="150" height="212" rx="4" fill="${voir(tShow(f, 100))}"/>
          <rect width="150" height="132" rx="4" fill="${voir(tShow(f, 550))}"/>
          <path d="M 95 -30 A 85 85 0 0 1 40 105" fill="none" stroke="${voir(tShow(f, 400))}" stroke-width="13" opacity="0.55"/>
          <text x="12" y="22" font-size="8.5" font-weight="700" fill="white" font-family="system-ui">Nos services publics</text>
          <text x="12" y="186" font-size="15" font-weight="700" fill="${voir(tShow(f, 550))}" font-family="system-ui">${theme}</text>
        </svg>`;
      })}
    </div>`);
  </script>
  <script type="text/markdown">
## En situation : des séries

La gamme « sans ordre » sur un graphique en barres (valeurs fictives) : une couleur par thématique.
  </script>
  <script type="module">
    const catSix = bestCategorical(spShow, CATEGORIEL.resserre, { mode: "light", ps: ps19 });
    const themesSeries = ["Santé", "Éducation", "Transports", "Justice", "Logement", "Écologie"];
    const seriesShow = catSix.ordered.map((c, i) => ({
      serie: themesSeries[i],
      valeur: [34, 27, 22, 17, 12, 9][i],
      couleur: c.sims[visionShow],
    }));
    display(Plot.plot({
      width: 640, height: 60 + seriesShow.length * 38, marginLeft: 100,
      x: { label: "part (%)", grid: true },
      y: { label: null, domain: themesSeries },
      color: { type: "identity" },
      marks: [
        Plot.barX(seriesShow, { y: "serie", x: "valeur", fill: "couleur" }),
        Plot.text(seriesShow, { y: "serie", x: "valeur", text: (d) => `${d.valeur}`, dx: 14, fill: encreShow }),
      ],
    }));
  </script>
