# Enquête hiérarchie : gabarit des figures web

Le rapport de l'enquête « Hiérarchie et management » (sortie prévue septembre 2026) compte plus de 60 figures, produites en R par la chaîne d'analyse du collectif. Ce notebook pose le **gabarit des versions web** d'une sélection de figures phares : mêmes messages, couleurs du spectre NSP, lisibilité vérifiée pour le daltonisme. Les figures définitives se brancheront sur les exports agrégés de la chaîne d'analyse, jamais sur les réponses individuelles.

Les couleurs elles-mêmes, et leur application au rapport : [La gamme de couleurs NSP](./couleurs-showcase).
  </script>
  <script type="module">
    import { Plot, html } from "./lib/deps.js";
    import { genSpectre, paliers, simulate } from "./lib/spectre.js";
    import { SCENARIOS } from "./lib/scenarios.js";
    const spectreEnq = genSpectre(SCENARIOS.resserre);
    const paliersEnq = paliers(19);
    const teinte = (fam, palier) => spectreEnq[fam][paliersEnq.indexOf(palier)];
  </script>
  <script type="text/markdown">
## L'archétype likert, colonne vertébrale du rapport

L'immense majorité des figures du rapport suit la même forme : une question à quatre réponses graduées (bien, plutôt bien, plutôt mal, mal), croisée ou non avec un profil de répondant. La palette actuelle oppose un vert et un rouge : pour un lecteur daltonien, **les deux pôles se confondent**. Le gabarit oppose le canard (la couleur d'identité du collectif) au coquelicot : lisible dans les trois formes de daltonisme, vérifiable ci-dessous avec le sélecteur. La forme choisie ici, dite « en miroir », fait partir le négatif à gauche du trait et le positif à droite : l'équilibre d'une question se lit d'un coup d'oeil.
  </script>
  <script type="module">
    const visionChoisie = view(Inputs.select(
      new Map([["vision normale", "normal"], ["deutéranopie", "deutan"], ["protanopie", "protan"], ["tritanopie", "tritan"]]),
      { label: "Simuler la vision" }
    ));
  </script>
  <script type="module">
    // Question d'ouverture du rapport : « Comment vous sentez-vous, en général, et au travail ? »
    // Valeurs du rapport, hors non-réponses (6 %).
    const modalites = [
      { nom: "mal", couleur: teinte("coquelicot", 600), sens: -1 },
      { nom: "plutôt mal", couleur: teinte("coquelicot", 300), sens: -1 },
      { nom: "plutôt bien", couleur: teinte("canard", 450), sens: 1 },
      { nom: "bien", couleur: teinte("canard", 600), sens: 1 },
    ];
    const reponsesDemo = {
      "en général": { mal: 4, "plutôt mal": 16, "plutôt bien": 57, bien: 17 },
      "au travail": { mal: 12, "plutôt mal": 31, "plutôt bien": 41, bien: 10 },
    };
    const segments = Object.entries(reponsesDemo).flatMap(([contexte, rep]) => {
      let gauche = -(rep["mal"] + rep["plutôt mal"]);
      return modalites.map((m) => {
        const seg = { contexte, modalite: m.nom, x0: gauche, x1: gauche + rep[m.nom],
                      couleur: simulate(m.couleur, visionChoisie), pct: rep[m.nom] };
        gauche += rep[m.nom];
        return seg;
      });
    });
    const encreEnq = teinte("ardoise", 800);
    display(Plot.plot({
      width: 680, height: 150, marginLeft: 90,
      x: { label: "part des répondants (%)", domain: [-60, 80], tickFormat: (d) => Math.abs(d) },
      y: { label: null },
      color: { type: "identity" },
      marks: [
        Plot.barX(segments, { y: "contexte", x1: "x0", x2: "x1", fill: "couleur", insetTop: 6, insetBottom: 6 }),
        Plot.text(segments.filter((s) => s.pct >= 7), {
          y: "contexte", x: (s) => (s.x0 + s.x1) / 2, text: (s) => `${s.pct}`,
          fill: "white", fontWeight: 600,
        }),
        Plot.ruleX([0], { stroke: encreEnq }),
      ],
    }));
    display(html`<figcaption style="max-width: 620px;">
      <strong>Comment vous sentez-vous, en général, et au travail ?</strong>
      De gauche à droite : mal, plutôt mal, plutôt bien, bien. Valeurs du rapport,
      hors non-réponses. Guide : le mal-être part à gauche du trait, le bien-être
      à droite ; l'écart entre les deux lignes est le message (on se sent nettement
      moins bien au travail que dans la vie).
    </figcaption>`);
    display(html`<div style="display:flex; gap:0.5em; margin-top:0.8em; flex-wrap:wrap;">
      ${modalites.map((m) => html`<span style="display:inline-flex; align-items:center; gap:0.35em; font-size:0.85em;">
        <span style="width:1em; height:1em; border-radius:3px; background:${simulate(m.couleur, visionChoisie)};"></span>${m.nom}</span>`)}
    </div>`);
  </script>
  <script type="text/markdown">
## L'écart importance / capacité d'agir (module 3)

La figure conceptuelle du rapport : les quatre valeurs du service public sont plébiscitées, mais la capacité d'agir dessus est perçue comme faible. Le cas extrême est le bon usage de l'argent public : jugé important par 95 % des répondants, avec seulement 35 % qui pensent pouvoir agir dessus. La forme « haltère » montre l'écart d'un coup d'oeil, là où le rapport R utilise deux graphiques séparés en miroir.
  </script>
  <script type="module">
    // Valeurs de démonstration : seul le couple argent public (95/35) est cité tel quel dans le rapport.
    const valeursDemo = [
      { valeur: "Traitement équitable des publics", importance: 96, agir: 44 },
      { valeur: "Bon usage de l'argent public", importance: 95, agir: 35 },
      { valeur: "Respect des lois et règlements", importance: 92, agir: 40 },
      { valeur: "Réduction des inégalités", importance: 88, agir: 30 },
    ];
    const cImportance = teinte("canard", 600);
    const cAgir = teinte("coquelicot", 500);
    display(Plot.plot({
      width: 680, height: 210, marginLeft: 230,
      x: { label: "part des répondants (%)", domain: [0, 100], grid: true },
      y: { label: null },
      marks: [
        Plot.link(valeursDemo, { y: "valeur", x1: "agir", x2: "importance",
          stroke: teinte("ardoise", 300), strokeWidth: 2.5 }),
        Plot.dot(valeursDemo, { y: "valeur", x: "importance", fill: cImportance, r: 6 }),
        Plot.dot(valeursDemo, { y: "valeur", x: "agir", fill: cAgir, r: 6 }),
        Plot.text(valeursDemo, { y: "valeur", x: "importance", text: (d) => `${d.importance}`, dx: 14, fill: cImportance, fontWeight: 600 }),
        Plot.text(valeursDemo, { y: "valeur", x: "agir", text: (d) => `${d.agir}`, dx: -14, fill: cAgir, fontWeight: 600 }),
      ],
    }));
    display(html`<figcaption style="max-width: 620px;">
      <strong>Importance accordée (canard) contre capacité d'agir perçue (coquelicot).</strong>
      Valeurs de démonstration, sauf l'argent public (chiffres du rapport). La longueur
      du trait gris est le message : ce qui compte le plus est ce sur quoi on peut le moins.
    </figcaption>`);
  </script>
  <script type="text/markdown">
## Ce que ce gabarit fixe, et ce qui reste

Fixé ici : les deux formes qui couvrent l'essentiel du rapport (likert divergent, haltère d'écart), la palette likert issue du spectre (canard, coquelicot, ardoise pour les non-réponses), le chiffre porté sur la barre, la note de lecture sous chaque figure. Le même vocabulaire visuel s'appliquera aux autres figures phares retenues avec la rédaction.

Reste à faire : brancher les exports agrégés réels de la chaîne R (un CSV par figure), arrêter la liste des figures phares avec le pôle éditorial, et poser le gabarit de page « dossier riche » côté site. Le kit R miroir (mêmes couleurs pour les 60 figures du PDF) est dans `exports/r/`.
  </script>
